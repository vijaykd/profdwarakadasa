  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGold)" stroke-width="15"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ringGold)" stroke-width="4" stroke-opacity="0.9"/>

