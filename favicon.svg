<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra-luxe metallic gold gradient -->
    <linearGradient id="goldSheen" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Deep sapphire radial background -->
    <radialGradient id="sapphireBg" cx="35%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#1b3a6b"/>
      <stop offset="45%" stop-color="#0b1e3d"/>
      <stop offset="85%" stop-color="#051024"/>
      <stop offset="100%" stop-color="#020814"/>
    </radialGradient>

    <!-- Coin Bezel Ring Gradient -->
